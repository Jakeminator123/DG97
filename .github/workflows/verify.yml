name: Verify website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production deps only. Tailwind 3's braces advisory has no patch yet (CVE-2026-93687).
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run test:images
      - run: npm run build
      - run: npm run test:smoke
